<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RRVUNL Practice AI</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    :root {
      --bg: #EEF1F5;
      --surface: #FFFFFF;
      --ink: #14213D;
      --muted: #55627A;
      --line: #D3DAE6;
      --accent: #1F4FD8;
      --accent-ink: #FFFFFF;
      --spark: #E59F00;
      --ok: #117A4D;
      --ok-bg: #E2F4EB;
      --bad: #B3261E;
      --bad-bg: #FBE6E4;
      --on-solid: #FFFFFF;
      --sol-bg: #F5F8FF;
      --font-display: 'Space Grotesk', 'Noto Sans Devanagari', system-ui, sans-serif;
      --font-body: 'Inter', 'Noto Sans Devanagari', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0D1526;
        --surface: #16213A;
        --ink: #E8EDF7;
        --muted: #9DAAC2;
        --line: #2A3858;
        --accent: #7FA2FF;
        --accent-ink: #0D1526;
        --spark: #FFC83D;
        --ok: #5FD39A;
        --ok-bg: #12332A;
        --bad: #FF8A80;
        --bad-bg: #3A1B1B;
        --on-solid: #0D1526;
        --sol-bg: #1A2848;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0D1526;
      --surface: #16213A;
      --ink: #E8EDF7;
      --muted: #9DAAC2;
      --line: #2A3858;
      --accent: #7FA2FF;
      --accent-ink: #0D1526;
      --spark: #FFC83D;
      --ok: #5FD39A;
      --ok-bg: #12332A;
      --bad: #FF8A80;
      --bad-bg: #3A1B1B;
      --on-solid: #0D1526;
      --sol-bg: #1A2848;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.55;
      padding-block: 22px 48px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .wrap {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .eyebrow {
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 1.75rem;
      line-height: 1.15;
      margin: 4px 0 6px;
      text-wrap: balance;
    }

    .sub {
      color: var(--muted);
      margin: 0;
      font-size: .95rem;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .chip {
      flex: none;
      font: inherit;
      font-size: .88rem;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      white-space: nowrap;
    }

    .chip small {
      color: var(--muted);
      font-weight: 400;
      margin-left: 4px;
      font-variant-numeric: tabular-nums;
    }

    .chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .chip[aria-pressed="true"] small {
      color: inherit;
      opacity: .85;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: .88rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .meta strong {
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1rem;
    }

    .rail {
      position: relative;
      height: 8px;
      margin-top: 8px;
    }

    .rail::before {
      content: "";
      position: absolute;
      inset: 3px 0;
      border-top: 2px dashed var(--line);
    }

    .rail-fill {
      position: absolute;
      left: 0;
      top: 2px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      transition: width .35s ease;
    }

    .rail-node {
      position: absolute;
      top: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--spark);
      transform: translateX(-50%);
      transition: left .35s ease;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
    }

    .tag {
      font-size: .72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .q {
      font-family: var(--font-display);
      font-size: 1.25rem;
      line-height: 1.4;
      margin: 8px 0 18px;
      text-wrap: balance;
      font-weight: 600;
    }

    .opts {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .opt {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      min-height: 50px;
      min-width: 0;
      text-align: left;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .opt .k {
      flex: none;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--line);
      border-radius: 6px;
      font-weight: 600;
      font-size: .85rem;
      color: var(--muted);
    }

    .opt .t {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .opt .s {
      flex: none;
      font-size: .78rem;
      font-weight: 600;
    }

    .opt:hover:not([aria-disabled="true"]) {
      border-color: var(--accent);
    }

    .opt[aria-disabled="true"] {
      cursor: default;
    }

    function renderSetup() {
      var mode=lsGet('rrvunl_ai_mode', 'both');
      var orKey=lsGet('rrvunl_or_key', '');
      var orModel=lsGet('rrvunl_or_model', 'openrouter/free');
      var gemKey=lsGet('rrvunl_gem_key', '');
      var gemModel=lsGet('rrvunl_gem_model', 'gemini-3.1-flash-lite');
      var topic=lsGet('rrvunl_or_topic', 'Transformer');
      var exam=lsGet('rrvunl_or_exam', EXAMS[0]);
      var lvl=lsGet('rrvunl_or_lvl', 'Medium');
      var n=lsGet('rrvunl_or_n', '6');
      var lang=lsGet('rrvunl_or_lang', 'Hinglish');
      var web=lsGet('rrvunl_or_web', '0')==='1';

      .opt.ok .k {
        background: var(--ok);
        border-color: var(--ok);
        color: var(--on-solid);
      }

      .opt.ok .s {
        color: var(--ok);
      }

      .opt.bad {
        border-color: var(--bad);
        background: var(--bad-bg);
      }

      '<div class="field"><label for="or-topic">Topic</label>'+'<input id="or-topic" type="text" list="topics" autocomplete="off" value="'+esc(topic)+'">'+'<datalist id="topics">'+TOPICS.map(function (x) {
          return '<option value="' + esc(x) + '">';
        }).join('')+'</datalist></div>'+'<div class="field"><label for="or-exam">Target Exam</label><select id="or-exam">'+optionsHtml(EXAMS, exam)+'</select></div>'+'<div class="grid2">'+'<div class="field"><label for="or-lvl">Level</label><select id="or-lvl">'+optionsHtml(['Easy', 'Medium', 'Hard'], lvl)+'</select></div>'+'<div class="field"><label for="or-n">Total sawal</label><select id="or-n">'+optionsHtml(['6', '10', '16'], n)+'</select></div>'+'<div class="field"><label for="or-lang">Bhasha / Language</label><select id="or-lang">'+optionsHtml(['Hinglish', 'Hindi', 'English'], lang)+'</select></div></div>'+'<label class="check" for="or-web"><input id="or-web" type="checkbox"'+(web ? ' checked' : '')+'> Web search se RRVUNL sawal search karo</label>'+(S.err ? '<div class="err" role="alert">' + esc(S.err) + '</div>' : '')+'<button class="btn full" id="gen"'+(S.busy ? ' disabled' : '')+'>'+(S.busy ? 'Sawal search ho rahe hain... thoda ruko' : 'Sawal banao')+'</button>'+'<div class="row">'+(AIQ.length ? '<button class="btn ghost" id="playai">Pichle AI sawal (' + AIQ.length + ') khelo</button>' : '')+((orKey || gemKey) ? '<button class="btn ghost" id="clearkey">Keys hatao</button>' : '')+'</div>'+'<p class="hint" style="margin-top:14px">AI galti kar sakta hai. Zaroori sawalon ka jawab standard book se ek baar check kar lo.</p></div>';

      .opt.bad .s {
        color: var(--bad);
      }

      .opt.dim {
        opacity: .65;
      }

      .sol {
        margin-top: 18px;
        padding: 16px;
        border: 1px solid var(--line);
        background: var(--sol-bg);
        border-radius: 8px;
      }

      .sol h2 {
        font-family: var(--font-display);
        font-size: .95rem;
        margin: 0 0 6px;
        letter-spacing: .04em;
        text-transform: uppercase;
      }

      function buildPrompt(f, countN, angle) {
        var langInst=f.lang==='Hindi'
        ? 'Sawal, 4 options, step-by-step solution aur exam suggestion sab shuddh aur aasan Hindi (Devanagari) mein likho (technical units/terms zaroorat par bracket mein English mein likh sakte ho).'
        : f.lang==='English'
          ? 'Write the questions, 4 options, step-by-step solutions with formulas, and the exam suggestion completely in clear English.'
          : 'Sawal aur options clear English ya Hinglish mein rakho, aur step-by-step solution (formula + calculation) aur exam suggestion aasan Hinglish mein likho.';
        return 'RRVUNL exam preparation ke liye '+countN+' unique MCQ banao. '+'Topic: '+f.topic+'. Level: '+f.lvl+'. Target exam: '+f.exam+'. '+(angle ? angle + ' ' : '')+(f.web ? 'Web search se RRVUNL ke previous year papers, syllabus aur current exam pattern dekhkar real exam-style sawal banao. ' : '')+'Har sawal ke exactly 4 options ho aur sirf ek sahi ho. '+langInst+' '+'Har sawal ke "exam" field mein ek line mein batao ki aisa sawal kis exam ya post mein aa sakta hai aur kyun. '+'Jawab dene se pehle har answer ek baar dobara verify karo. '+'Output sirf valid JSON ho is format mein: {"questions":[{"q":"...","o":["...","...","...","..."],"a":0,"e":"...","exam":"..."}]}. '+'"a" sahi option ka index hai (0 se 3).';
      }

      .sol p {
        margin: 0;
      }

      .verdict-ok {
        color: var(--ok);
      }

      .verdict-bad {
        color: var(--bad);
      }

      .btn {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-ink);
        padding: 13px 18px;
        min-height: 48px;
      }

      .btn.ghost {
        background: transparent;
        color: var(--ink);
        border: 1.5px solid var(--line);
      }

      .btn.full {
        width: 100%;
        margin-top: 14px;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      .row .btn {
        flex: 1 1 180px;
      }

      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .score-big {
        font-family: var(--font-display);
        font-size: 3rem;
        line-height: 1;
        margin: 10px 0 4px;
        font-variant-numeric: tabular-nums;
      }

      .score-big span {
        font-size: 1.4rem;
        color: var(--muted);
      }

      .review {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }

      .review li {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        background: var(--surface);
      }

      .review b {
        display: block;
        margin-bottom: 4px;
        font-weight: 600;
      }

      .review span {
        color: var(--muted);
        font-size: .92rem;
      }

      .note {
        font-size: .8rem;
        color: var(--muted);
        margin: 0;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-top: 14px;
      }

      .field label {
        font-size: .82rem;
        font-weight: 600;
      }

      .field input,
      .field select {
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-radius: 8px;
        padding: 11px 12px;
        min-height: 46px;
        width: 100%;
        min-width: 0;
      }

      .grid2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0 12px;
      }

      .check {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
        font-size: .92rem;
      }

      .check input {
        width: 20px;
        height: 20px;
        flex: none;
      }

      .hint {
        font-size: .82rem;
        color: var(--muted);
        margin: 6px 0 0;
      }

      .err {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--bad-bg);
        color: var(--bad);
        border: 1px solid var(--bad);
        font-size: .92rem;
        overflow-wrap: anywhere;
      }

      .warn {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--sol-bg);
        color: var(--ink);
        border: 1px solid var(--spark);
        font-size: .86rem;
      }

      .api-box {
        margin-top: 14px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--sol-bg);
      }

      .api-box .tag {
        margin-bottom: 2px;
      }

      .api-box .field:first-of-type {
        margin-top: 8px;
      }

      .sol p.exam {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--line);
      }

      .btn[disabled] {
        opacity: .6;
        cursor: progress;
      }

      .hide {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {

        .rail-fill,
        .rail-node {
          transition: none;
        }
      }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Rajasthan Rajya Vidyut Utpadan Nigam</div>
      <h1>RRVUNL Practice</h1>
      <p class="sub">Sawal padho, option chuno, solution turant dekho.</p>
    </header>
    <div class="chips" id="chips" role="group" aria-label="Vishay chuno"></div>
    <main id="app"></main>
    <p class="note">Practice ke liye banaye gaye sawal hain. Exam se pehle official syllabus aur latest notification
      zaroor dekh lein.</p>
  </div>

  <script>
    var SUBJECTS = [
      { key: 'ai', label: 'AI RRVUNL' },
      { key: 'all', label: 'Sab vishay' },
      { key: 'et', label: 'Electrical' },
      { key: 'pp', label: 'Power Plant' },
      { key: 'rj', label: 'Rajasthan GK' },
      { key: 'mr', label: 'Maths & Reasoning' },
      { key: 'gs', label: 'Science' }
    ];
    var SUBJECT_NAME = {}; SUBJECTS.forEach(function (s) { SUBJECT_NAME[s.key] = s.label; });
    var ALL_LIMIT = 20;

    var Q = [
      // Electrical
      { s: 'et', q: 'What is the SI unit of electrical resistance?', o: ['Siemens', 'Ohm', 'Henry', 'Farad'], a: 1, e: "Resistance R = V / I hota hai, aur iski SI unit Ohm (Ω) hai. Siemens conductance ki unit hai, Henry inductance ki aur Farad capacitance ki." },
      { s: 'et', q: 'A 12 V battery is connected across a 4 Ω resistor. What current flows?', o: ['0.33 A', '8 A', '3 A', '48 A'], a: 2, e: "Ohm's law: I = V / R = 12 / 4 = 3 A." },
      { s: 'et', q: 'What is the power consumed by a purely resistive load on 220 V drawing 5 A?', o: ['44 W', '225 W', '4400 W', '1100 W'], a: 3, e: "P = V × I = 220 × 5 = 1100 W. Resistive load mein power factor 1 hota hai." },
      { s: 'et', q: 'A transformer works on the principle of:', o: ['Self induction', 'Mutual induction', 'Electrostatic induction', 'Hall effect'], a: 1, e: "Transformer mein primary ka badalta flux secondary coil mein EMF banata hai. Ise mutual induction kehte hain." },
      { s: 'et', q: 'The SI unit of inductance is:', o: ['Henry', 'Weber', 'Tesla', 'Coulomb'], a: 0, e: "Inductance ki SI unit Henry (H) hai. Weber flux ki aur Tesla flux density ki unit hai." },
      { s: 'et', q: 'What is the standard frequency of AC supply in India?', o: ['25 Hz', '60 Hz', '50 Hz', '100 Hz'], a: 2, e: "India mein AC supply 50 Hz par chalti hai. USA mein 60 Hz use hota hai." },
      { s: 'et', q: 'Three resistors of 2 Ω, 3 Ω and 6 Ω are connected in parallel. The equivalent resistance is:', o: ['1 Ω', '11 Ω', '2 Ω', '0.5 Ω'], a: 0, e: "1/R = 1/2 + 1/3 + 1/6 = 3/6 + 2/6 + 1/6 = 1. Isliye R = 1 Ω." },
      { s: 'et', q: 'Which of these metals is the best conductor of electricity?', o: ['Copper', 'Aluminium', 'Silver', 'Iron'], a: 2, e: "Silver ki resistivity sabse kam hai, isliye sabse achha conductor hai. Copper dusre number par hai, par cost ki wajah se wires mein copper use hota hai." },
      { s: 'et', q: 'A fuse wire is made of a material that has:', o: ['High melting point', 'Low melting point', 'High resistivity and high melting point', 'Zero resistance'], a: 1, e: "Fuse wire tin aur lead ke alloy se banti hai jiska melting point kam hota hai. Zyada current par wire pighalkar circuit tod deti hai." },
      { s: 'et', q: 'A charged capacitor stores energy in the form of:', o: ['Magnetic field', 'Heat', 'Chemical energy', 'Electric field'], a: 3, e: "Capacitor ki plates ke beech electric field mein energy store hoti hai: E = ½CV². Inductor magnetic field mein energy rakhta hai." },
      { s: 'et', q: 'What is the synchronous speed of a 4-pole motor on a 50 Hz supply?', o: ['3000 rpm', '1500 rpm', '1000 rpm', '750 rpm'], a: 1, e: "Ns = 120f / P = 120 × 50 / 4 = 1500 rpm." },
      { s: 'et', q: 'What is the power factor of a purely resistive AC circuit?', o: ['0', '0.5', 'Infinity', '1'], a: 3, e: "Resistive circuit mein voltage aur current in phase hote hain, phase angle 0° hota hai. Isliye power factor cos 0° = 1." },
      { s: 'et', q: "Kirchhoff's current law is based on the conservation of:", o: ['Energy', 'Charge', 'Momentum', 'Mass'], a: 1, e: "KCL kehta hai ki kisi junction par aane wala total current, jaane wale total current ke barabar hota hai. Yeh charge conservation par based hai. KVL energy conservation par based hai." },
      { s: 'et', q: 'The direction of force on a current-carrying conductor in a magnetic field is given by:', o: ["Fleming's right-hand rule", "Fleming's left-hand rule", "Lenz's law", "Ampere's swimming rule"], a: 1, e: "Motor action (force ki direction) ke liye Fleming ka left-hand rule use hota hai. Generator mein EMF ki direction ke liye right-hand rule lagta hai." },
      { s: 'et', q: 'The SI unit of electrical conductance is:', o: ['Ohm', 'Mho only', 'Siemens', 'Weber'], a: 2, e: "Conductance G = 1/R ki SI unit Siemens (S) hai. Purane naam 'mho' ko ab Siemens se replace kiya gaya hai." },

      // Power plant
      { s: 'pp', q: 'In a thermal power plant, the boiler is used to produce:', o: ['Electricity', 'Steam', 'Coal gas', 'Hot air'], a: 1, e: "Boiler mein coal jalakar pani ko high pressure steam mein badla jata hai, jo turbine ko ghumata hai." },
      { s: 'pp', q: 'The Rankine cycle is the ideal cycle for:', o: ['Petrol engines', 'Diesel engines', 'Steam power plants', 'Gas turbines'], a: 2, e: "Steam power plants Rankine cycle par chalte hain. Gas turbine Brayton cycle par, petrol engine Otto cycle par aur diesel engine Diesel cycle par chalta hai." },
      { s: 'pp', q: 'Which isotope is commonly used as fuel in nuclear power reactors?', o: ['Uranium-235', 'Uranium-238 only', 'Carbon-14', 'Radium-226'], a: 0, e: "U-235 fission ke liye use hota hai. Natural uranium mein iska hissa sirf lagbhag 0.7% hota hai, isliye kai reactors mein enrichment ki jati hai." },
      { s: 'pp', q: 'What is the function of a moderator in a nuclear reactor?', o: ['Absorb all neutrons', 'Slow down fast neutrons', 'Cool the reactor core', 'Produce steam'], a: 1, e: "Moderator (jaise heavy water ya graphite) fast neutrons ki speed kam karta hai, taki woh asani se fission kara sakein." },
      { s: 'pp', q: 'Which type of power plant produces the largest share of electricity in India?', o: ['Hydro', 'Nuclear', 'Wind', 'Thermal (coal-based)'], a: 3, e: "India ki total bijli generation mein sabse bada hissa coal-based thermal plants ka hai." },
      { s: 'pp', q: 'In a boiler, the economiser is used to:', o: ['Heat feed water using flue gases', 'Increase steam pressure', 'Condense the steam', 'Remove ash'], a: 0, e: "Economiser chimney mein jaane wali garm flue gases ki heat se boiler mein jaane wala feed water pehle se garm karta hai. Isse fuel bachta hai." },
      { s: 'pp', q: 'The condenser in a steam power plant converts:', o: ['Water into steam', 'Exhaust steam into water', 'Coal into gas', 'Heat into current'], a: 1, e: "Turbine se nikli exhaust steam condenser mein thandi hokar wapas pani ban jati hai, jo dobara boiler mein bheja jata hai." },
      { s: 'pp', q: 'Which turbine is best suited for a very high head and low discharge in a hydro plant?', o: ['Kaplan turbine', 'Francis turbine', 'Pelton wheel', 'Propeller turbine'], a: 2, e: "Pelton wheel ek impulse turbine hai jo high head aur kam pani ke flow ke liye best hai. Kaplan low head aur zyada flow ke liye hota hai." },
      { s: 'pp', q: 'The Kaplan turbine is used for:', o: ['High head, low discharge', 'Low head, high discharge', 'Only steam', 'Only wind'], a: 1, e: "Kaplan ek reaction (axial flow) turbine hai jisme blades adjustable hote hain. Yeh low head aur high discharge ke liye use hota hai." },

    function shuffle(a) {
      a = a.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

          '<input id="gem-model" type="text" list="gem-models" autocomplete="off" spellcheck="false" value="' + esc(gemModel) + '">' +
          '<datalist id="gem-models"><option value="gemini-3.1-flash-lite"><option value="gemini-flash-lite-latest"><option value="gemini-flash-latest"><option value="gemini-2.5-flash"></datalist></div>' +
          '<button class="btn ghost" id="test-gem" style="margin-top:10px;width:100%;font-size:.85rem">🔌 Gemini Key Test karo</button>' +
          '<div id="test-gem-res"></div></div>' +

          '<div class="field"><label for="or-topic">Topic (RRVUNL Syllabus)</label>' +
          '<select id="or-topic">' + optionsHtml(TOPICS, topic) + '</select></div>' +
          '<div class="field"><label for="or-exam">Target Exam</label><select id="or-exam">' + optionsHtml(EXAMS, exam) + '</select></div>' +
          '<div class="grid2">' +
          '<div class="field"><label for="or-lvl">Level</label><select id="or-lvl">' + optionsHtml(['Easy', 'Medium', 'Hard'], lvl) + '</select></div>' +
          '<div class="field"><label for="or-n">Total sawal</label><select id="or-n">' + optionsHtml(['6', '10', '16'], n) + '</select></div>' +
          '<div class="field"><label for="or-lang">Bhasha / Language</label><select id="or-lang">' + optionsHtml(['Hinglish', 'Hindi', 'English'], lang) + '</select></div></div>' +
          '<label class="check" for="or-web"><input id="or-web" type="checkbox"' + (web ? ' checked' : '') + '> Web search se RRVUNL sawal search karo</label>' +
          (S.err ? '<div class="err" role="alert">' + esc(S.err) + '</div>' : '') +
          '<button class="btn full" id="gen"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Sawal search ho rahe hain... thoda ruko' : 'Sawal banao') + '</button>' +
          '<div class="row">' +
          (AIQ.length ? '<button class="btn ghost" id="playai">Pichle AI sawal (' + AIQ.length + ') khelo</button>' : '') +
          ((orKey || gemKey) ? '<button class="btn ghost" id="clearkey">Keys hatao</button>' : '') + '</div>' +
          '<p class="hint" style="margin-top:14px">AI galti kar sakta hai. Zaroori sawalon ka jawab standard book se ek baar check kar lo.</p></div>';

        toggleApiBoxes();
      }

      function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

      function showTestRes(elId, msg, ok) {
        var el = document.getElementById(elId);
        if (!el) return;
        el.style.cssText = 'margin-top:8px;padding:8px 12px;border-radius:6px;font-size:.82rem;border:1px solid ' + (ok ? 'var(--ok)' : 'var(--bad)') + ';background:' + (ok ? 'var(--ok-bg)' : 'var(--bad-bg)') + ';color:' + (ok ? 'var(--ok)' : 'var(--bad)') + ';overflow-wrap:anywhere';
        el.textContent = (ok ? '✅ ' : '❌ ') + msg;
      }

      function testApi(which) {
        var key, model, resEl, btn;
        if (which === 'or') {
          key = val('or-key'); model = val('or-model') || 'openrouter/free';
          resEl = 'test-or-res'; btn = document.getElementById('test-or');
          if (!key) return showTestRes(resEl, 'Pehle OpenRouter API key daalo.', false);
          if (btn) { btn.disabled = true; btn.textContent = 'Testing...'; }
          fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json', 'X-Title': 'RRVUNL Test' },
            body: JSON.stringify({ model: model, max_tokens: 5, messages: [{ role: 'user', content: 'Hi' }] })
          }).then(function (r) {
            return r.json().then(function (d) {
              if (btn) { btn.disabled = false; btn.textContent = '🔌 OpenRouter Key Test karo'; }
              if (r.ok) showTestRes(resEl, 'Key aur model sahi hain! Model: ' + (d.model || model), true);
              else showTestRes(resEl, (d.error && d.error.message) || ('Error ' + r.status), false);
            });
          }).catch(function (e) {
            if (btn) { btn.disabled = false; btn.textContent = '🔌 OpenRouter Key Test karo'; }
            showTestRes(resEl, 'Connect nahi ho paya: ' + e.message, false);
          });
        } else {
          key = val('gem-key'); model = (val('gem-model') || 'gemini-3.1-flash-lite').replace(/^models\//, '');
          resEl = 'test-gem-res'; btn = document.getElementById('test-gem');
          if (!key) return showTestRes(resEl, 'Pehle Gemini API key daalo.', false);
          if (btn) { btn.disabled = true; btn.textContent = 'Testing...'; }
          fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'Hi' }] }], generationConfig: { maxOutputTokens: 5 } })
          }).then(function (r) {
            return r.json().then(function (d) {
              if (btn) { btn.disabled = false; btn.textContent = '🔌 Gemini Key Test karo'; }
              if (r.ok) showTestRes(resEl, 'Key aur model sahi hain! Model: ' + model, true);
              else showTestRes(resEl, (d.error && d.error.message) || ('Error ' + r.status), false);
            });
          }).catch(function (e) {
            if (btn) { btn.disabled = false; btn.textContent = '🔌 Gemini Key Test karo'; }
            showTestRes(resEl, 'Connect nahi ho paya: ' + e.message, false);
          });
        }
      }

      function friendlyError(provider, err) {
        var m = err && err.message ? err.message : String(err);
        if (err && (err.status === 401 || err.status === 403)) return provider + ': API key galat ya unauthorized hai.';
        if (err && err.status === 402) return provider + ': Account mein credits nahi hain.';
        if (err && err.status === 429) return provider + ': Rate limit/quota full ho gaya hai. Thodi der baad try karo.';
        if (err && (err.status === 400 || err.status === 404)) return provider + ': Request reject hui (' + m + '). Model ka naam ya key check karo.';
        if (err && err.name === 'TypeError') return provider + ': Connect nahi ho paya. Internet check karo ya file ko seedha browser mein kholo.';
        return provider + ': ' + m;
      }

      function parseQs(txt, srcLabel) {
        if (!txt) return [];
        var t = String(txt).replace(/```json|```/gi, '').trim();
        var data = null;
        try { data = JSON.parse(t); } catch (e) {
          var a = t.indexOf('{'), b = t.lastIndexOf('}');
          if (a >= 0 && b > a) { try { data = JSON.parse(t.slice(a, b + 1)); } catch (e2) { } }
          if (!data) {
            var c = t.indexOf('['), d = t.lastIndexOf(']');
            if (c >= 0 && d > c) { try { data = JSON.parse(t.slice(c, d + 1)); } catch (e3) { } }
          }
        }
        var arr = Array.isArray(data) ? data : (data && data.questions) || [];
        return arr.filter(function (x) {
          if (!x || typeof x.q !== 'string' || !Array.isArray(x.o) || x.o.length !== 4) return false;
          var validIdx = (typeof x.a === 'number' || (typeof x.a === 'string' && x.a.trim() !== '')) ? Number(x.a) : NaN;
          return Number.isInteger(validIdx) && validIdx >= 0 && validIdx <= 3;
        }).map(function (x) {
          return {
            s: 'ai', src: srcLabel || 'AI',
            q: String(x.q), o: x.o.map(String), a: Number(x.a),
            e: String(x.e || 'Solution nahi mila.'), x: x.exam ? String(x.exam) : ''
          };
        });
      }

      function buildPrompt(f, countN, angle) {
        var langInst = f.lang === 'Hindi'
          ? 'Sawal, 4 options, step-by-step solution aur exam suggestion sab shuddh aur aasan Hindi (Devanagari) mein likho (technical units/terms zaroorat par bracket mein English mein likh sakte ho).'
          : f.lang === 'English'
          ? 'Write the questions, 4 options, step-by-step solutions with formulas, and the exam suggestion completely in clear English.'
          : 'Sawal aur options clear English ya Hinglish mein rakho, aur step-by-step solution (formula + calculation) aur exam suggestion aasan Hinglish mein likho.';
        return 'RRVUNL exam preparation ke liye ' + countN + ' unique MCQ banao. ' +
          'Topic: ' + f.topic + '. Level: ' + f.lvl + '. Target exam: ' + f.exam + '. ' +
          (angle ? angle + ' ' : '') +
          (f.web ? 'Web search se RRVUNL ke previous year papers, syllabus aur current exam pattern dekhkar real exam-style sawal banao. ' : '') +
          'Har sawal ke exactly 4 options ho aur sirf ek sahi ho. ' + langInst + ' ' +
          'Har sawal ke "exam" field mein ek line mein batao ki aisa sawal kis exam ya post mein aa sakta hai aur kyun. ' +
          'Jawab dene se pehle har answer ek baar dobara verify karo. ' +
          'Output sirf valid JSON ho is format mein: {"questions":[{"q":"...","o":["...","...","...","..."],"a":0,"e":"...","exam":"..."}]}. ' +
          '"a" sahi option ka index hai (0 se 3).';
      }

      function fetchOpenRouter(f, countN, angle) {
        var body = {
          model: f.orModel, temperature: 0.6,
          messages: [
            { role: 'system', content: 'You are an expert question-setter for Rajasthan power sector exams (RRVUNL Technician, Junior Engineer, Plant Attendant). Reply with ONLY valid JSON. No markdown, no commentary.' },
            { role: 'user', content: buildPrompt(f, countN, angle) }
          ]
        };
        if (f.web) body.plugins = [{ id: 'web', max_results: 4 }];
        return fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + f.orKey, 'Content-Type': 'application/json', 'X-Title': 'RRVUNL Practice' },
          body: JSON.stringify(body)
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (d) {
            if (!r.ok) {
              var e = new Error((d && d.error && d.error.message) || ('Error ' + r.status));
              e.status = r.status; throw e;
            }
            var txt = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
            var list = parseQs(txt, 'OpenRouter');
            if (!list.length) throw new Error('Sahi JSON format mein sawal nahi mile.');
            return list;
          });
        }).catch(function (err) { throw new Error(friendlyError('OpenRouter', err)); });
      }

      function fetchGemini(f, countN, angle) {
        var model = f.gemModel.replace(/^models\//, '');
        var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(f.gemKey);
        var body = {
          systemInstruction: { parts: [{ text: 'You are an expert question-setter for Rajasthan power sector exams (RRVUNL Technician, Junior Engineer, Plant Attendant). Reply with ONLY valid JSON. No markdown, no commentary.' }] },
          contents: [{ role: 'user', parts: [{ text: buildPrompt(f, countN, angle) }] }],
          generationConfig: { temperature: 0.6 }
        };
        if (f.web) body.tools = [{ google_search: {} }];
        return fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (d) {
            if (!r.ok) {
              var e = new Error((d && d.error && d.error.message) || ('Error ' + r.status));
              e.status = r.status; throw e;
            }
            var parts = d && d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts;
            var txt = Array.isArray(parts) ? parts.map(function (p) { return p.text || ''; }).join('') : '';
            var list = parseQs(txt, 'Gemini');
            if (!list.length) throw new Error('Sahi JSON format mein sawal nahi mile.');
            return list;
          });
        }).catch(function (err) { throw new Error(friendlyError('Gemini', err)); });
      }

      function generate() {
        if (S.busy) return;
        var f = {
          mode: val('ai-mode') || 'both',
          orKey: val('or-key'), orModel: val('or-model') || 'openrouter/free',
          gemKey: val('gem-key'), gemModel: val('gem-model') || 'gemini-3.1-flash-lite',
          topic: val('or-topic') || 'Transformer', exam: val('or-exam'),
          lvl: val('or-lvl'), n: parseInt(val('or-n'), 10) || 6,
          lang: val('or-lang') || 'Hinglish',
          web: !!(document.getElementById('or-web') || {}).checked
        };
        lsSet('rrvunl_ai_mode', f.mode);
        lsSet('rrvunl_or_key', f.orKey); lsSet('rrvunl_or_model', f.orModel);
        lsSet('rrvunl_gem_key', f.gemKey); lsSet('rrvunl_gem_model', f.gemModel);
        lsSet('rrvunl_or_topic', f.topic); lsSet('rrvunl_or_exam', f.exam);
        lsSet('rrvunl_or_lvl', f.lvl); lsSet('rrvunl_or_n', String(f.n));
        lsSet('rrvunl_or_lang', f.lang);
        lsSet('rrvunl_or_web', f.web ? '1' : '0');

        if ((f.mode === 'openrouter' || f.mode === 'both') && !f.orKey) {
          S.err = 'OpenRouter API key daalo (ya mode "Sirf Gemini API" chuno).'; return renderSetup();
        }
        if ((f.mode === 'gemini' || f.mode === 'both') && !f.gemKey) {
          S.err = 'Gemini API key daalo (ya mode "Sirf OpenRouter API" chuno).'; return renderSetup();
        }

        S.err = ''; S.warn = ''; S.busy = true; renderSetup();

        var tasks = [];
        if (f.mode === 'both') {
          var n1 = Math.ceil(f.n / 2), n2 = Math.floor(f.n / 2);
          tasks.push(fetchOpenRouter(f, n1, 'Focus on conceptual theory and standard numericals.'));
          tasks.push(fetchGemini(f, n2, 'Focus on application-based and recent RRVUNL exam pattern questions.'));
        } else if (f.mode === 'gemini') {
          tasks.push(fetchGemini(f, f.n, ''));
        } else {
          tasks.push(fetchOpenRouter(f, f.n, ''));
        }

        Promise.all(tasks.map(function (p) {
          return p.then(function (res) { return { ok: true, res: res }; })
            .catch(function (err) { return { ok: false, err: err.message || String(err) }; });
        })).then(function (results) {
          var combined = [], errs = [];
          results.forEach(function (r) {
            if (r.ok) combined = combined.concat(r.res);
            else errs.push(r.err);
          });
          S.busy = false;
          if (!combined.length) {
            S.err = errs.join(' | ');
            if (S.view === 'setup') renderSetup();
            return;
          }
          if (errs.length) S.warn = 'Ek API se sawal nahi aa paye (' + errs[0] + '). Baaki sawal load ho gaye hain.';
          combined = shuffle(combined);
          AIQ = combined;
          lsSet('rrvunl_ai_q', JSON.stringify(combined));
          if (S.view === 'setup') start('ai', combined.slice()); else drawChips();
        });
      }

      start('all');
  </script>
